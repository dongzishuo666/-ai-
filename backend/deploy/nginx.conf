# ============================================================
# 文件：deploy/nginx.conf
# 部署位置：/etc/nginx/sites-available/multi-ai
# 说明：静态文件服务 + 反向代理 + SSE 免缓冲
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 上传文件限制（略大于 10MB，留余量）
    client_max_body_size 12m;

    # ---------- 访问日志 ----------
    access_log /var/log/nginx/multi-ai.access.log;
    error_log  /var/log/nginx/multi-ai.error.log warn;

    # ---------- 前端静态文件（Vue dist）----------
    root /server/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源长缓存 ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /server/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---------- SSE 关键配置 ----------
        proxy_buffering off;              # 禁用缓冲，事件即时下发
        proxy_cache off;                  # 禁用缓存
        proxy_read_timeout 300s;          # SSE 长连接读超时
        proxy_send_timeout 300s;
        proxy_set_header Connection "";   # 清空 Connection 头，保持长连接
        chunked_transfer_encoding on;
    }

    # ---------- 禁止访问隐藏文件 ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
