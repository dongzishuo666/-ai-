<svg width="690" height="470" viewBox="0 0 690 470" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="28" width="150" height="210" rx="12" fill="#FFFFFF" stroke="#2E7CF6" stroke-width="2" /><text x="22" y="62" font-size="13" font-weight="bold" fill="#2E7CF6">STEP 1 · 前置</text><text x="22" y="94" font-size="18" font-weight="bold" fill="#0B2545">前置解析</text><line x1="22" y1="112" x2="128" y2="112" stroke="#E2E8F0" stroke-width="1.5" /><text x="22" y="140" font-size="13" fill="#64748B">识别 PDF / Word /</text><text x="22" y="162" font-size="13" fill="#64748B">TXT / PPT 格式</text><text x="22" y="190" font-size="13" fill="#64748B">提取核心内容，</text><text x="22" y="212" font-size="13" fill="#64748B">超长自动截断</text><line x1="152" y1="133" x2="168" y2="133" stroke="#2E7CF6" stroke-width="2.5" /><polygon points="166,127 178,133 166,139" fill="#2E7CF6" /><rect x="180" y="28" width="150" height="210" rx="12" fill="#FFFFFF" stroke="#2E7CF6" stroke-width="2" /><text x="202" y="62" font-size="13" font-weight="bold" fill="#2E7CF6">STEP 2 · 第一棒</text><text x="202" y="94" font-size="18" font-weight="bold" fill="#0B2545">方案生成</text><line x1="202" y1="112" x2="308" y2="112" stroke="#E2E8F0" stroke-width="1.5" /><text x="202" y="140" font-size="13" fill="#64748B">官方渠道 AI：</text><text x="202" y="162" font-size="13" fill="#64748B">角色定位 · 任务目标</text><text x="202" y="190" font-size="13" fill="#64748B">输出规范 · 约束</text><text x="202" y="212" font-size="13" fill="#64748B">产出初版 Prompt</text><line x1="332" y1="133" x2="348" y2="133" stroke="#2E7CF6" stroke-width="2.5" /><polygon points="346,127 358,133 346,139" fill="#2E7CF6" /><rect x="360" y="28" width="150" height="210" rx="12" fill="#FFFFFF" stroke="#2E7CF6" stroke-width="2" /><text x="382" y="62" font-size="13" font-weight="bold" fill="#2E7CF6">STEP 3 · 第二棒</text><text x="382" y="94" font-size="18" font-weight="bold" fill="#0B2545">方案优化</text><line x1="382" y1="112" x2="488" y2="112" stroke="#E2E8F0" stroke-width="1.5" /><text x="382" y="140" font-size="13" fill="#64748B">中转渠道 AI：</text><text x="382" y="162" font-size="13" fill="#64748B">补约束 · 强指令</text><text x="382" y="190" font-size="13" fill="#64748B">剔冗余 · 提效率</text><text x="382" y="212" font-size="13" fill="#64748B">产出优化版 Prompt</text><line x1="512" y1="133" x2="528" y2="133" stroke="#2E7CF6" stroke-width="2.5" /><polygon points="526,127 538,133 526,139" fill="#2E7CF6" /><rect x="540" y="28" width="150" height="210" rx="12" fill="rgba(0,201,167,0.10)" stroke="#00C9A7" stroke-width="3" /><text x="562" y="62" font-size="13" font-weight="bold" fill="#00A88C">STEP 4 · 第三棒</text><text x="562" y="94" font-size="18" font-weight="bold" fill="#0B2545">汇总定稿</text><line x1="562" y1="112" x2="668" y2="112" stroke="rgba(0,201,167,0.4)" stroke-width="1.5" /><text x="562" y="140" font-size="13" fill="#0B7A68">官方渠道 AI 裁决：</text><text x="562" y="162" font-size="13" fill="#0B7A68">是否匹配需求 ·</text><text x="562" y="184" font-size="13" fill="#0B7A68">覆盖核心 · 无歧义</text><text x="562" y="212" font-size="13" fill="#0B7A68">合格即最终输出</text><line x1="345" y1="244" x2="345" y2="276" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" /><rect x="60" y="280" width="570" height="86" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" /><text x="90" y="316" font-size="15" font-weight="bold" fill="#0B2545">异常兜底</text><text x="90" y="344" font-size="13.5" fill="#64748B">任一环节输出为空 → 自动重试 1 次 → 仍失败则降级调用备用 AI，保障输出稳定</text><text x="0" y="412" font-size="14" fill="#64748B">全链路串行调用——单时刻仅占用 1 个 AI 连接，降低并发资源消耗</text><text x="0" y="440" font-size="14" fill="#64748B">中间结果仅在链路中临时传递，完成即释放，不落库持久化</text></svg>